<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Día de trabajo</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="pedidator-tokens.css">
<link rel="stylesheet" href="ds/pedidator/components/bundle.css">
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..800&family=Figtree:wght@400..700&display=swap">
<style>
body{margin:0}
</style>
</helmet>
<div class="pd pd-shell" data-theme="{{theme}}" style="width: 390px; height: 844px">
<header class="pd-header">
<span class="pd-header__company">Carnisseria Vila</span>
<span class="pd-header__user">Marta</span>
</header>
<div class="pd-status pd-status--ok" role="status">
<svg class="pd-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 21a9 9 0 1 0 0-18 9 9 0 0 0 0 18z M8 12.3l2.7 2.7L16 9.5"></path></svg>
Sincronizado · 10:42
</div>
<main class="pd-main pd-scroll">
<div class="pd-day-head">
<h1 class="pd-section-title">Jueves 17</h1>
<button class="pd-btn pd-btn--icon" type="button" aria-label="Día anterior"><svg class="pd-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M14.5 6l-6 6 6 6"></path></svg></button>
<button class="pd-btn pd-btn--icon" type="button" aria-label="Día siguiente"><svg class="pd-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M9.5 6l6 6-6 6"></path></svg></button>
</div>
<div class="pd-cal" aria-label="Semana del 14 al 20 de diciembre">
<span class="pd-cal__dow">L</span><span class="pd-cal__dow">M</span><span class="pd-cal__dow">X</span><span class="pd-cal__dow">J</span><span class="pd-cal__dow">V</span><span class="pd-cal__dow">S</span><span class="pd-cal__dow">D</span>
<button type="button" class="pd-cal__day">14<span class="pd-cal__marks"></span></button>
<button type="button" class="pd-cal__day">15<span class="pd-cal__marks"><i class="pd-cal__mark pd-cal__mark--orders"></i></span></button>
<button type="button" class="pd-cal__day">16<span class="pd-cal__marks"><i class="pd-cal__mark pd-cal__mark--orders"></i></span></button>
<button type="button" class="pd-cal__day pd-cal__day--prep pd-cal__day--today pd-cal__day--selected" aria-pressed="true">17<span class="pd-cal__marks"><i class="pd-cal__mark pd-cal__mark--orders"></i><i class="pd-cal__mark pd-cal__mark--prep"></i></span></button>
<button type="button" class="pd-cal__day pd-cal__day--prep">18<span class="pd-cal__marks"><i class="pd-cal__mark pd-cal__mark--orders"></i><i class="pd-cal__mark pd-cal__mark--prep"></i></span></button>
<button type="button" class="pd-cal__day pd-cal__day--important">19<span class="pd-cal__marks"><i class="pd-cal__mark pd-cal__mark--orders"></i><i class="pd-cal__mark pd-cal__mark--important"></i></span></button>
<button type="button" class="pd-cal__day">20<span class="pd-cal__marks"></span></button>
</div>
<div class="pd-progress">
<div class="pd-progress__title">{{progressTitle}}</div>
<div class="pd-progress__track" role="progressbar" aria-label="Encargos preparados"><div class="pd-progress__fill" style="width: {{progressWidth}}"></div></div>
<div class="pd-progress__label"><span>{{pendingLabel}}</span><span>{{deliveredLabel}}</span></div>
</div>
<section class="pd-prep">
<div class="pd-prep__title">
<svg class="pd-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 21a9 9 0 1 0 0-18 9 9 0 0 0 0 18z M12 7.5V12l3 2"></path></svg>
Preparar hoy para mañana
<span class="pd-prep__count">{{prepCount}}</span>
</div>
<sc-for list="{{prep}}" as="p" hint-placeholder-count="2">
<button type="button" class="{{p.cls}}" role="checkbox" aria-checked="{{p.done}}" onClick="{{p.toggle}}">
<span class="pd-item__check"><svg class="pd-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"></path></svg></span>
<span class="pd-item__body"><span class="pd-item__name">{{p.name}}</span><span class="pd-item__detail"><span>{{p.sub}}</span></span></span>
<span class="pd-item__qty">{{p.qty}}</span>
</button>
</sc-for>
</section>
<sc-for list="{{orders}}" as="o" hint-placeholder-count="3">
<article class="{{o.cls}}">
<sc-if value="{{o.isNext}}" hint-placeholder-val="{{ false }}">
<div class="pd-day-order__next">Próxima recogida</div>
</sc-if>
<div class="pd-day-order__head">
<span class="pd-day-order__time">{{o.time}}</span>
<div class="pd-day-order__who">
<span class="pd-day-order__name">{{o.name}}</span>
<span class="pd-day-order__tags">
<sc-if value="{{o.prepared}}" hint-placeholder-val="{{ false }}">
<span class="pd-badge pd-badge--ok"><svg class="pd-icon pd-icon--sm" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"></path></svg>Preparado</span>
</sc-if>
<sc-if value="{{o.notPrepared}}" hint-placeholder-val="{{ true }}">
<span class="pd-badge">{{o.countLabel}}</span>
</sc-if>
<sc-if value="{{o.important}}" hint-placeholder-val="{{ false }}">
<span class="pd-badge pd-badge--warn"><svg class="pd-icon pd-icon--sm" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 21V4 M5 4h11l-2 4 2 4H5"></path></svg>Importante</span>
</sc-if>
</span>
</div>
<button type="button" class="{{o.deliverCls}}" onClick="{{o.deliver}}">Entregar</button>
</div>
<div class="pd-day-order__items">
<sc-for list="{{o.items}}" as="it" hint-placeholder-count="2">
<button type="button" class="{{it.cls}}" role="checkbox" aria-checked="{{it.done}}" onClick="{{it.toggle}}">
<span class="pd-item__check"><svg class="pd-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"></path></svg></span>
<span class="pd-item__body">
<span class="pd-item__name">{{it.name}}</span>
<span class="pd-item__detail">
<sc-if value="{{it.hasNote}}" hint-placeholder-val="{{ false }}"><span>{{it.note}}</span></sc-if>
<sc-if value="{{it.showPrep}}" hint-placeholder-val="{{ false }}"><span class="pd-badge pd-badge--prep"><svg class="pd-icon pd-icon--sm" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 21a9 9 0 1 0 0-18 9 9 0 0 0 0 18z M12 7.5V12l3 2"></path></svg>Día anterior</span></sc-if>
<sc-if value="{{it.showLate}}" hint-placeholder-val="{{ false }}"><span class="pd-item__late"><svg class="pd-icon pd-icon--sm" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 4 2.8 19.5h18.4L12 4z M12 10v4.5 M12 17.3v.2"></path></svg>Había que prepararlo ayer</span></sc-if>
</span>
</span>
<span class="pd-item__qty">{{it.qty}}</span>
</button>
</sc-for>
</div>
</article>
</sc-for>
<div class="pd-collapsed">
<span>{{deliveredTitle}}</span>
<svg class="pd-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 9.5l6 6 6-6"></path></svg>
</div>
</main>
<div class="pd-actionbar">
<a class="pd-btn pd-btn--primary pd-btn--lg pd-btn--block" href="Encargo.dc.html" style="color: var(--on-brand)">
<svg class="pd-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14 M5 12h14"></path></svg>
Nuevo encargo
</a>
</div>
<nav class="pd-nav" aria-label="Secciones">
<a class="pd-nav__item pd-nav__item--active" href="Main.dc.html" style="color: var(--brand-strong)"><span><svg class="pd-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 5h14v15H5z M5 9.5h14 M9 3v4 M15 3v4"></path></svg></span>Día</a>
<a class="pd-nav__item" href="Tickets.dc.html" style="color: var(--ink-muted)"><span><svg class="pd-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 3v18l2-1.5 2 1.5 2-1.5 2 1.5 2-1.5 2 1.5V3z M9 8h6 M9 12h6"></path></svg></span>Tickets</a>
<a class="pd-nav__item" href="Cliente.dc.html" style="color: var(--ink-muted)"><span><svg class="pd-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 11a3.5 3.5 0 1 0 0-7 3.5 3.5 0 0 0 0 7z M2.5 20a6.5 6.5 0 0 1 13 0 M16 4.3a3.5 3.5 0 0 1 0 6.4 M18 14.2a6.5 6.5 0 0 1 3.5 5.8"></path></svg></span>Clientes</a>
</nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["neutral","butcher","fishmonger","greengrocer","bakery"],"default":"butcher","section":"Empresa"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  seed() {
    return {
      orders: [
        { id: 'o1', time: '08:45', name: 'Carme Soler', status: 'delivered', items: [{ name: 'Carne picada mixta', qty: '500 g', done: true }] },
        { id: 'o2', time: '09:30', name: 'Montse Vila', status: 'delivered', items: [{ name: 'Pollo de corral', qty: '1 u', done: true }, { name: 'Pechuga fileteada', qty: '600 g', done: true }] },
        { id: 'o3', time: '11:00', name: 'Bar La Plaça', status: 'pending', important: true, items: [{ name: 'Entrecot de ternera', qty: '2,5 kg', note: 'fileteado fino', done: true }, { name: 'Butifarra', qty: '6 u' }, { name: 'Hamburguesas', qty: '12 u', note: 'sin cebolla' }] },
        { id: 'o4', time: '12:15', name: 'Jordi Ferrer', status: 'pending', items: [{ name: 'Pollo relleno', qty: '1 u', prep: true }, { name: 'Costillas de cerdo', qty: '1,2 kg' }] },
        { id: 'o5', time: '13:00', name: 'Rosa Puig', status: 'pending', items: [{ name: 'Lomo adobado', qty: '800 g', prep: true, done: true }] }
      ],
      prep: [
        { name: 'Pavo relleno', qty: '1 u', sub: 'Núria Camps · mañana 10:00' },
        { name: 'Redondo mechado', qty: '1,5 kg', sub: 'Bar La Plaça · mañana 12:30', done: true }
      ]
    };
  }
  data() {
    return this.state && this.state.orders ? this.state : this.seed();
  }
  toggleItem(orderId, index) {
    var d = this.data();
    var orders = d.orders.map(function (o) {
      if (o.id !== orderId) return o;
      var items = o.items.map(function (it, i) { return i === index ? Object.assign({}, it, { done: !it.done }) : it; });
      return Object.assign({}, o, { items: items });
    });
    this.setState({ orders: orders, prep: d.prep });
  }
  togglePrep(index) {
    var d = this.data();
    var prep = d.prep.map(function (p, i) { return i === index ? Object.assign({}, p, { done: !p.done }) : p; });
    this.setState({ orders: d.orders, prep: prep });
  }
  deliver(orderId) {
    var d = this.data();
    var orders = d.orders.map(function (o) { return o.id === orderId ? Object.assign({}, o, { status: 'delivered' }) : o; });
    this.setState({ orders: orders, prep: d.prep });
  }
  renderVals() {
    var self = this, d = this.data();
    var isPrepared = function (o) { return o.items.length > 0 && o.items.every(function (it) { return !!it.done; }); };
    var delivered = d.orders.filter(function (o) { return o.status === 'delivered'; }).length;
    var prepared = d.orders.filter(function (o) { return o.status === 'delivered' || isPrepared(o); }).length;
    var total = d.orders.length;
    var pending = d.orders.filter(function (o) { return o.status === 'pending'; });
    var orders = pending.map(function (o, n) {
      var ok = isPrepared(o), done = o.items.filter(function (it) { return !!it.done; }).length;
      return {
        time: o.time, name: o.name, isNext: n === 0, prepared: ok, notPrepared: !ok, important: !!o.important,
        countLabel: done + ' de ' + o.items.length + ' preparados',
        cls: 'pd-day-order' + (ok ? ' pd-day-order--prepared' : '') + (n === 0 ? ' pd-day-order--next' : ''),
        deliverCls: 'pd-btn' + (ok ? ' pd-btn--primary' : ''),
        deliver: function () { self.deliver(o.id); },
        items: o.items.map(function (it, i) {
          return {
            name: it.name, qty: it.qty, note: it.note || '', hasNote: !!it.note, done: !!it.done,
            showPrep: !!it.prep && !!it.done, showLate: !!it.prep && !it.done,
            cls: 'pd-item' + (it.done ? ' pd-item--done' : ''),
            toggle: function () { self.toggleItem(o.id, i); }
          };
        })
      };
    });
    var prepDone = d.prep.filter(function (p) { return !!p.done; }).length;
    return {
      theme: this.props.theme ?? 'butcher',
      progressTitle: prepared + ' de ' + total + ' encargos preparados',
      progressWidth: Math.round(100 * prepared / total) + '%',
      pendingLabel: (total - prepared) + ' por preparar',
      deliveredLabel: delivered + ' entregados',
      deliveredTitle: 'Entregados (' + delivered + ')',
      prepCount: prepDone + ' de ' + d.prep.length,
      prep: d.prep.map(function (p, i) {
        return { name: p.name, qty: p.qty, sub: p.sub, done: !!p.done, cls: 'pd-item' + (p.done ? ' pd-item--done' : ''), toggle: function () { self.togglePrep(i); } };
      }),
      orders: orders
    };
  }
}
</script>
</body>
</html>
